<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>配件選配金額｜Honda South TC</title>
<meta name="theme-color" content="#14161A">
<meta name="description" content="Honda South TC 選配金額合計：選車型、逐一挑選 10 項配件，自動加總，成本另以按鈕隱藏顯示。">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="選配金額">
<meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14161A; --ink-2:#1B1E23; --paper:#F1F2F0; --card:#fff;
  --line:#E3E5E1; --line-2:#EDEEEA; --dim:#6B7278; --dim-2:#9AA0A6;
  --red:#DE2A20; --red-deep:#B02019; --red-tint:#FBEEEC;
  --green:#2F7D46; --green-tint:#EDF5EF;
  --r:6px; --shadow:0 1px 2px rgba(20,22,26,.05), 0 6px 18px -12px rgba(20,22,26,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
body{margin:0;background:var(--paper);color:var(--ink);overflow-x:hidden;max-width:100vw;
  font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,-apple-system,sans-serif;
  font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
  padding-bottom:calc(152px + env(safe-area-inset-bottom));}
button{font-family:inherit;cursor:pointer}
select{font-family:inherit}
.num{font-family:"Barlow Condensed",ui-sans-serif,sans-serif;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.015em}

/* hero */
.hero{background:linear-gradient(178deg,#191C21 0%,#14161A 46%,#0F1114 100%);color:#F4F5F3;position:relative;overflow:hidden;
  padding:calc(16px + env(safe-area-inset-top)) 16px 20px}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:linear-gradient(90deg,var(--red),#7A1812 48%,rgba(255,255,255,.08))}
.wrap{max-width:600px;margin:0 auto}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand img{height:26px;width:auto;display:block}
.brand .div{width:1px;height:24px;background:rgba(255,255,255,.18)}
.brand .tx{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand .tx b{font-size:14px;letter-spacing:.06em;color:#fff;white-space:nowrap}
.brand .tx span{font-size:11px;color:#8A9096;letter-spacing:.04em;white-space:nowrap}
.ver{margin-left:auto;display:inline-flex;align-items:center;gap:5px;border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.05);color:#A7ADB2;border-radius:3px;padding:4px 8px;font-size:10.5px;
  font-family:"Barlow Condensed",sans-serif;font-weight:600;letter-spacing:.06em;white-space:nowrap}
.ver .d{width:5px;height:5px;border-radius:50%;background:#3E9B52;box-shadow:0 0 0 2px rgba(62,155,82,.18)}

.lbl{font-size:11px;letter-spacing:.16em;color:#8A9096;margin-bottom:9px}
.models{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.model{min-width:0;overflow:hidden;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:4px;color:#B8BDBB;
  padding:9px 4px 8px;display:flex;flex-direction:column;align-items:center;gap:1px;transition:.14s;min-width:0}
.model b{font-size:13px;font-weight:700;letter-spacing:.02em;color:#E7E9E6;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.model span{font-size:9px;color:#7E858B;letter-spacing:.05em;white-space:nowrap}
.model[aria-pressed="true"]{background:#F4F5F3;border-color:#F4F5F3}
.model[aria-pressed="true"] b{color:var(--ink)}
.model[aria-pressed="true"] span{color:var(--red)}
.model:active{transform:scale(.97)}

/* rows */
main{max-width:600px;margin:16px auto 0;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.card-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.card-top h2{margin:0;font-size:13px;font-weight:700;letter-spacing:.04em}
.card-top .k{font-size:10.5px;color:var(--dim-2);letter-spacing:.03em}

.row{display:flex;align-items:center;gap:8px;
  padding:9px 14px;border-bottom:1px solid #F2F3F0;transition:background .12s}
.row:last-child{border-bottom:0}
.row.filled{background:#FCFCFB}
.idx{flex:none;width:18px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:12px;color:#C2C6C2;letter-spacing:.04em}
.row.filled .idx{color:var(--red)}
.selwrap{position:relative;flex:1 1 auto;min-width:0}
.selwrap::after{content:"";position:absolute;right:9px;top:50%;width:6px;height:6px;border-right:1.5px solid #9AA0A6;
  border-bottom:1.5px solid #9AA0A6;transform:translateY(-70%) rotate(45deg);pointer-events:none}
select{width:100%;max-width:100%;min-width:0;appearance:none;-webkit-appearance:none;border:1px solid var(--line);border-radius:4px;background:#fff;
  color:var(--ink);font-size:14px;padding:8px 26px 8px 9px;line-height:1.35;text-overflow:ellipsis;white-space:nowrap}
select:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 3px rgba(20,22,26,.07)}
.row.filled select{border-color:#DCDEDA;background:#fff}
.price{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;font-variant-numeric:tabular-nums;
  text-align:right;flex:none;width:78px;color:var(--ink);line-height:1.15;display:flex;flex-direction:column;align-items:flex-end}
.price .c{font-size:10.5px;font-weight:600;color:var(--red);letter-spacing:.02em;line-height:1.3;display:none}
.price .c i{font-style:normal;color:#B0B4B0;font-weight:500;margin-right:2px}
body.cost .price .c{display:block}
.price.zero{color:#C4C8C3}

/* summary */
.summary{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(20,22,26,.98);
  border-top:1px solid rgba(255,255,255,.1);padding:11px 16px calc(11px + env(safe-area-inset-bottom));
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.summary .in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:12px}
.sum-tx{min-width:0;flex:1}
.sum-lb{font-size:10.5px;letter-spacing:.1em;color:#8A9096;display:flex;align-items:center;gap:6px}
.sum-lb .tag{font-size:9px;border:1px solid rgba(222,42,32,.5);color:#FF8C7F;padding:0 4px;border-radius:2px;letter-spacing:.04em}
.sum-money{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30px;line-height:1.05;color:#fff;
  font-variant-numeric:tabular-nums;letter-spacing:.01em;display:flex;align-items:baseline;gap:6px}
.sum-money .cur{font-size:.6em;color:#8A9096;vertical-align:.08em}
.sum-sub{font-size:10.5px;color:#7E858B;font-variant-numeric:tabular-nums;line-height:1.4;margin-top:1px}
.sum-sub b{color:#D6D9D6;font-weight:600}
.act{display:flex;flex-direction:column;gap:6px;flex:none}
.btn{corder:0;border:0;border-radius:4px;font-size:12px;font-weight:700;letter-spacing:.05em;padding:8px 12px;white-space:nowrap;transition:.14s}
.btn-ghost{background:rgba(255,255,255,.1);color:#E3E6E2}
.btn-ghost:active{background:rgba(255,255,255,.2)}
.btn-on{background:#fff;color:var(--ink)}
.btn-red{background:var(--red);color:#fff}
body.cost .btn-ghost.reveal{background:rgba(222,42,32,.18);color:#FFB3AB;border:1px solid rgba(222,42,32,.45)}

.tools{display:flex;gap:8px;margin-top:12px}
.tool{flex:1;border:1px solid var(--line);background:#fff;color:var(--dim);border-radius:4px;padding:9px;font-size:12px;
  letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:5px}
.tool:active{background:#F6F7F4}
.tool svg{width:13px;height:13px}

.tip{max-width:600px;margin:14px auto 0;padding:0 16px;font-size:10.5px;color:#A2A7A2;line-height:1.75}
.toast{position:fixed;left:50%;bottom:calc(124px + env(safe-area-inset-bottom));transform:translate(-50%,12px);
  background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:0 12px 32px -12px rgba(0,0,0,.4);
  padding:9px 14px;border-radius:5px;font-size:12.5px;opacity:0;pointer-events:none;transition:.2s;z-index:30;max-width:calc(100vw - 40px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (min-width:560px){ body{font-size:14.5px} }
</style>
</head>

const CATS = ['外觀空力','內裝收納','燈系','安全輔助','影音舒適','其他'];
const MODELS = [
  {id:'CRV',  label:'CR-V',  sub:'SUV'},
  {id:'ZRV',  label:'ZR-V',  sub:'SUV'},
  {id:'HRV',  label:'HR-V',  sub:'跨界'},
  {id:'CIVIC',label:'CIVIC', sub:'房車'},
  {id:'FIT',  label:'FIT',   sub:'掀背'}
];
const SLOTS = 10;
const COST_RATE = 0.8;
const KEY = 'hondaAcc.v1';

let state = { model:'CRV', drafts:{}, showCost:false };

function money(n){ return Math.round(n).toLocaleString('en-US'); }
function costOf(p){ return Math.round(p * COST_RATE); }
function dataOf(m){ return DATA[m] || []; }
function itemOf(m, idx){ return idx == null || idx === '' ? null : dataOf(m)[+idx] || null; }

/* ── 儲存草稿（每個車型分別記住上次的選法） ── */
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(!raw) return;
    const o = JSON.parse(raw);
    if(o && typeof o === 'object'){
      if(o.model && DATA[o.model]) state.model = o.model;
      if(o.drafts && typeof o.drafts === 'object') state.drafts = o.drafts;
    }
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify({model:state.model, drafts:state.drafts})); }catch(e){}
}
function sel(){ return state.drafts[state.model] || (state.drafts[state.model] = new Array(SLOTS).fill('')); }

/* ── 車型 ── */
function renderModels(){
  document.getElementById('models').innerHTML = MODELS.map(m =>
    `<button type="button" class="model" data-model="${m.id}" aria-pressed="${m.id===state.model}">
       <b>${m.label}</b><span>${m.sub}</span></button>`).join('');
  const cur = MODELS.find(m => m.id === state.model);
  document.getElementById('cardTitle').textContent = cur.label + ' 選配項目';
}

/* ── 10 個下拉選單 ── */
function optionsHTML(m, chosen){
  const items = dataOf(m);
  const groups = CATS.map(() => []);
  items.forEach((it, i) => { (groups[it.c] || groups[groups.length-1]).push({it, i}); });
  let html = `<option value="">— 未選 —</option>`;
  groups.forEach((g, gi) => {
    if(!g.length) return;
    html += `<optgroup label="${CATS[gi]}">`;
    g.forEach(({it, i}) => {
      html += `<option value="${i}"${String(chosen)===String(i)?' selected':''}>${it.n}　$${money(it.p)}</option>`;
    });
    html += `</optgroup>`;
  });
  return html;
}

function renderRows(){
  const chosen = sel();
  const html = chosen.map((v, i) => {
    const it = itemOf(state.model, v);
    return `<div class="row${it?' filled':''}" data-slot="${i}">
      <span class="idx">${String(i+1).padStart(2,'0')}</span>
      <span class="selwrap"><select data-slot="${i}" aria-label="第 ${i+1} 項配件">${optionsHTML(state.model, v)}</select></span>
      <span class="price${it?'':' zero'}">${it ? '$'+money(it.p) : '—'}
        <span class="c">${it ? '<i>成本</i>$'+money(costOf(it.p)) : ''}</span></span>
    </div>`;
  }).join('');
  document.getElementById('rows').innerHTML = html;
  document.getElementById('cardMeta').textContent = dataOf(state.model).length + ' 項可選';
}

/* ── 合計 ── */
function totals(){
  const chosen = sel();
  let list = 0, cost = 0, count = 0;
  chosen.forEach(v => {
    const it = itemOf(state.model, v);
    if(it){ list += it.p; cost += costOf(it.p); count++; }
  });
  return {list, cost, count};
}

function renderSummary(){
  const t = totals();
  const main = document.getElementById('sumMain');
  const sub  = document.getElementById('sumSub');
  const lb   = document.getElementById('sumLb');
  const tag  = document.getElementById('costTag');

  if(state.showCost){
    main.textContent = money(t.cost);
    lb.firstChild.textContent = '成本合計';
    tag.hidden = false;
    sub.innerHTML = t.count
      ? `定價 <b>$${money(t.list)}</b>　·　價差 <b>$${money(t.list - t.cost)}</b>（${Math.round((1-COST_RATE)*100)}%）　·　${t.count} 項`
      : '尚未選擇配件';
  }else{
    main.textContent = money(t.list);
    lb.firstChild.textContent = '定價合計';
    tag.hidden = true;
    sub.textContent = t.count ? `${t.count} 項配件 · 已選 ${t.count} / ${SLOTS}` : '尚未選擇配件';
  }
  document.body.classList.toggle('cost', state.showCost);
  document.getElementById('btnCost').textContent = state.showCost ? '隱藏成本' : '顯示成本';
}

function renderAll(){ renderModels(); renderRows(); renderSummary(); }

/* ── 事件 ── */
document.getElementById('models').addEventListener('click', e => {
  const b = e.target.closest('.model'); if(!b) return;
  state.model = b.dataset.model;
  save(); renderAll();
});

document.getElementById('rows').addEventListener('change', e => {
  const s = e.target.closest('select'); if(!s) return;
  const arr = sel();
  const slot = +s.dataset.slot;
  const val = s.value;
  // 同一項不重複選：若已在其他欄位，清掉那一欄
  if(val !== ''){
    arr.forEach((v, i) => { if(i !== slot && String(v) === String(val)) arr[i] = ''; });
  }
  arr[slot] = val;
  save();
  const it = itemOf(state.model, val);
  const row = s.closest('.row');
  const price = row.querySelector('.price');
  row.classList.toggle('filled', !!it);
  price.classList.toggle('zero', !it);
  price.firstChild.textContent = it ? '$' + money(it.p) : '—';
  price.querySelector('.c').innerHTML = it ? '<i>成本</i>$' + money(costOf(it.p)) : '';
  renderRows();   // 重新繪製以同步「重複選項被清空」的狀態
  renderSummary();
});

document.getElementById('btnCost').addEventListener('click', () => {
  state.showCost = !state.showCost;
  renderSummary();
});

document.getElementById('btnClear').addEventListener('click', () => {
  state.drafts[state.model] = new Array(SLOTS).fill('');
  save(); renderAll();
  toast('已清空 ' + MODELS.find(m => m.id === state.model).label + ' 的選配');
});

document.getElementById('btnCopy').addEventListener('click', async () => {
  const m = MODELS.find(x => x.id === state.model);
  const chosen = sel();
  const lines = [];
  chosen.forEach((v, i) => {
    const it = itemOf(state.model, v);
    if(it) lines.push(`${String(i+1).padStart(2,'0')} ${it.n}　$${money(it.p)}`);
  });
  const t = totals();
  if(!t.count){ toast('尚未選擇配件'); return; }
  let txt = `【${m.label} 選配明細】\n` + lines.join('\n') + `\n──────────\n定價合計 $${money(t.list)}`;
  if(state.showCost) txt += `\n成本合計 $${money(t.cost)}`;
  try{
    await navigator.clipboard.writeText(txt);
    toast('已複製，可直接貼到 LINE');
  }catch(err){
    const ta = document.createElement('textarea');
    ta.value = txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast('已複製，可直接貼到 LINE'); }
    catch(e2){ toast('複製失敗，請長按選取'); }
    ta.remove();
  }
});

let tt = null;
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(tt); tt = setTimeout(() => el.classList.remove('show'), 2200);
}

/* 版本顯示 */
document.querySelectorAll('[data-ver]').forEach(el => { el.textContent = 'v' + window.APP_VERSION; });

/* 更新偵測：版本號可點擊強制重整 */
document.querySelector('.ver').addEventListener('click', () => {
  if(!confirm('強制重新整理到最新版本？\n（已選的配件會保留）')) return;
  const jobs = [];
  if(window.caches && caches.keys) jobs.push(caches.keys().then(ks => Promise.all(ks.map(k => caches.delete(k)))));
  if('serviceWorker' in navigator && navigator.serviceWorker.getRegistrations)
    jobs.push(navigator.serviceWorker.getRegistrations().then(rs => Promise.all(rs.map(r => r.unregister()))));
  Promise.all(jobs).catch(()=>{}).then(() => location.reload());
});

/* 啟動 */
load(); renderAll();

if('serviceWorker' in navigator && location.protocol === 'https:'){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      function offer(w){
        if(!navigator.serviceWorker.controller || !w) return;
        toast('有新版本，按版本號可更新');
      }
      reg.addEventListener('updatefound', () => {
        const w = reg.installing;
        if(w) w.addEventListener('statechange', () => { if(w.state === 'installed') offer(w); });
      });
      const check = () => { if(document.visibilityState === 'visible') reg.update().catch(()=>{}); };
      document.addEventListener('visibilitychange', check);
      setTimeout(check, 4000);
    }).catch(()=>{});
  });
}
</script>
</body>
</html>
